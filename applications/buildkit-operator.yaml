# buildkit-operator — pointer ApplicationSet (app-of-apps). The real Application
# lives in the PRIVATE deploy repo, which the deploy workflow of
# SocialGouv/buildkit-operator bumps after every green images build (chart commit
# + per-component image digests); ArgoCD syncs it automatically.
# Rollback: `argocd app rollback buildkit-operator-prod` — then revert the bump
# commit in socialgouv/buildkit-operator-gitops so autosync does not re-apply it.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: buildkit-operator-gitops
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - name: buildkit-operator-gitops
            namespace: argocd-sre
            cluster: in-cluster
  template:
    metadata:
      name: "{{ .name }}"
    spec:
      project: default
      destination:
        server: https://kubernetes.default.svc
      source:
        repoURL: git@github.com:socialgouv/buildkit-operator-gitops.git
        targetRevision: main
        path: apps
      syncPolicy:
        automated:
          prune: false
          selfHeal: false
