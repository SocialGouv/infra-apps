apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ci-secrets
spec:
  generators:
    - list:
        elements:
          - name: ci-secrets-dev
            cluster: ovh-dev
          - name: ci-secrets-prod
            cluster: ovh-prod
  goTemplate: true
  template:
    metadata:
      name: "{{ .name }}"
    spec:
      destination:
        name: "{{ .cluster }}"
      project: default
      source:
        repoURL: https://github.com/SocialGouv/infra-apps.git
        targetRevision: master
        # plain manifest directory: each SealedSecret carries its own namespace,
        # and the sealing key is per-cluster, hence one directory per cluster
        path: "ci-secrets/{{ .cluster }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: false
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
