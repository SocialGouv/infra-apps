gha-runner-scale-set:
  githubConfigUrl: "https://github.com/SocialGouv"
  githubConfigSecret: github-token

  # The runner image is pinned by version AND digest, and staleness here is
  # fatal rather than merely untidy: ARC runs its runners with --disableupdate
  # (the image is immutable), so a runner below what the Actions service
  # accepts exits the moment it connects. ARC reads that as a crash, retries
  # five times, marks the EphemeralRunner Failed — and the Failed records
  # still count as capacity, so the service believes the set is provisioned
  # and assigns nothing. The whole scale set deadlocks silently.
  #
  # That is what happened: it pointed at ghcr.io/socialgouv/actions-runner
  # :latest, whose last release (1.2.14, 2025-06-02) carries runner 2.324.0.
  # Actions is disabled on that repository — it is not in the organisation's
  # 54-repository allowlist — so its required check can never report, every
  # dependency bump stayed unmergeable, no release was cut and the tag froze.
  # The scale set served nothing for over a year before anyone looked.
  #
  # ghcr.io/socialgouv/iterion-ci-runner is upstream's image plus gcc and the
  # libc headers Go's race detector needs (cgo); upstream ships no C compiler
  # and no other tooling either — a workflow gets Go, Node and kubectl from
  # its own setup-* steps. SocialGouv/iterion builds it (ci/arc-runner) from a
  # version-and-digest pin of upstream that Renovate follows, proves cgo under
  # -race as the runner user, and publishes only validated main builds, one
  # immutable version 1.<run>.<attempt> each, never a floating tag. Renovate
  # keeps this pin current from those versions; do not replace it with a
  # floating tag, and do not let it go stale.
  #
  # `runner` and `init-dind-externals` carry the SAME image: the init copies
  # /home/runner/externals out of the distribution the runner then executes.
  # `configure-inotify` only runs /bin/sh and keeps upstream's image.
  # tests/runner_image.py holds the pin and the alignment on the rendered
  # PodSpec.

  controllerServiceAccount:
    namespace: arc-systems
    name: arc-systems-gha-rs-controller

  template:
    spec:
      initContainers:
        # inotify instances are shared by all processes with the same real UID
        # on a node (the runners use UID 1001). The kernel's default 128 can
        # reject a watcher while ordinary file descriptors remain available.
        # Run before either runner or dind can accept work, not in a CI job.
        - name: configure-inotify
          image: ghcr.io/actions/actions-runner:2.337.0
          command:
            - /bin/sh
            - -ec
            - |
              minimum=${ARC_INOTIFY_MIN_USER_INSTANCES:-1024}
              case "$minimum" in
                ''|*[!0-9]*) echo "ARC_INOTIFY_MIN_USER_INSTANCES must be a non-negative integer" >&2; exit 1 ;;
              esac
              # Normalize decimal input and reject values outside the kernel's
              # signed-int range before any shell arithmetic or sysctl write.
              while [ "${minimum#0}" != "$minimum" ]; do minimum=${minimum#0}; done
              minimum=${minimum:-0}
              if [ "${#minimum}" -gt 10 ] || [ "$minimum" -gt 2147483647 ]; then
                echo "ARC_INOTIFY_MIN_USER_INSTANCES exceeds the kernel integer range" >&2
                exit 1
              fi
              if [ "$minimum" -eq 0 ]; then
                echo "ARC inotify node tuning disabled explicitly"
                exit 0
              fi
              limit_file=/proc/sys/fs/inotify/max_user_instances
              read -r current < "$limit_file"
              if [ "$current" -lt "$minimum" ]; then
                printf '%s\n' "$minimum" > "$limit_file"
              fi
              read -r actual < "$limit_file"
              if [ "$actual" -lt "$minimum" ]; then
                echo "ARC inotify ceiling is still below the requested floor" >&2
                exit 1
              fi
              echo "ARC node inotify max_user_instances: $current -> $actual (minimum $minimum)"
          env:
            - name: ARC_INOTIFY_MIN_USER_INSTANCES
              value: "1024"
          securityContext:
            # This is a NODE sysctl, not a pod namespaced sysctl. The existing
            # dind container is privileged too; keep this action explicit.
            privileged: true
            runAsNonRoot: false
            runAsUser: 0
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
        - name: init-dind-externals
          image: ghcr.io/socialgouv/iterion-ci-runner:1.5.1@sha256:a01629900c9d7902dce3315b94aea7063fbe97af6f1f08a9652ab073c378f123
          imagePullPolicy: Always
          command:
            [
              "cp",
              "-r",
              "-v",
              "/home/runner/externals/.",
              "/home/runner/tmpDir/",
            ]
          volumeMounts:
            - name: dind-externals
              mountPath: /home/runner/tmpDir
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
        - name: dind
          image: docker:dind
          # Native sidecar: kubelet waits for the daemon before starting runner.
          # A socket file alone is not evidence that the Docker API is ready.
          restartPolicy: Always
          startupProbe:
            exec:
              command:
                - docker
                - --host=unix:///run/docker/docker.sock
                - info
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
          args:
            - dockerd
            - --host=unix:///run/docker/docker.sock
            - --group=$(DOCKER_GROUP_GID)
          env:
            - name: DOCKER_GROUP_GID
              value: "123"
            - name: DOCKER_IPTABLES_LEGACY
              value: "1"
          securityContext:
            privileged: true
          volumeMounts:
            - name: work
              mountPath: /home/runner/_work
            - name: dind-sock
              mountPath: /run/docker
            - name: dind-externals
              mountPath: /home/runner/externals
      containers:
        - name: runner
          image: ghcr.io/socialgouv/iterion-ci-runner:1.5.1@sha256:a01629900c9d7902dce3315b94aea7063fbe97af6f1f08a9652ab073c378f123
          imagePullPolicy: Always
          command: ["/home/runner/run.sh"]
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
          env:
            - name: DOCKER_HOST
              value: unix:///run/docker/docker.sock
          volumeMounts:
            - name: work
              mountPath: /home/runner/_work
            - name: dind-sock
              mountPath: /run/docker
              readOnly: true

      volumes:
        - name: work
          emptyDir: {}
        - name: dind-sock
          emptyDir: {}
        - name: dind-externals
          emptyDir: {}
