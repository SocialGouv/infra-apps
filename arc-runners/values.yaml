gha-runner-scale-set:
  githubConfigUrl: "https://github.com/SocialGouv"
  githubConfigSecret: github-token

  # The runner image is pinned by version AND digest, and staleness here is
  # fatal rather than merely untidy: ARC runs its runners with --disableupdate
  # (the image is immutable), so a runner below what the Actions service
  # accepts exits the moment it connects. ARC reads that as a crash, retries
  # five times, marks the EphemeralRunner Failed — and the Failed records
  # still count as capacity, so the service believes the set is provisioned
  # and assigns nothing. The whole scale set deadlocks silently.
  #
  # That is what happened: it pointed at ghcr.io/socialgouv/actions-runner
  # :latest, whose last release (1.2.14, 2025-06-02) carries runner 2.324.0.
  # Actions is disabled on that repository — it is not in the organisation's
  # 54-repository allowlist — so its required check can never report, every
  # dependency bump stayed unmergeable, no release was cut and the tag froze.
  # The scale set served nothing for over a year before anyone looked.
  #
  # ghcr.io/socialgouv/iterion-ci-runner is upstream's image plus gcc and the
  # libc headers Go's race detector needs (cgo) — upstream ships no C compiler
  # — and, since 1.12.1, iterion's Go (its go.mod version) and Node 24, baked
  # in the runner's tool cache (/opt/hostedtoolcache, RUNNER_TOOL_CACHE) so
  # setup-go and setup-node find them instead of downloading them. For EVERY
  # repository on this scale set, that means:
  #   - a job asking setup-go/setup-node for a range the baked version
  #     satisfies (`1.26`, `1.x`, `24`) without `check-latest: true` gets the
  #     baked version, not the newest patch — ask for an exact version, or set
  #     check-latest, when the newest patch matters;
  #   - a `container:` job gets the tool cache mounted from the dind daemon's
  #     filesystem, where /opt/hostedtoolcache does not exist: an empty,
  #     root-owned /__t, which a non-root container cannot write to.
  # Everything else a workflow needs (kubectl, …) still comes from its own
  # setup-* steps. SocialGouv/iterion builds the image (ci/arc-runner) from a
  # version-and-digest pin of upstream that Renovate follows, proves cgo under
  # -race as the runner user, and publishes only validated main builds, one
  # immutable version 1.<run>.<attempt> each, never a floating tag. Renovate
  # keeps this pin current from those versions; do not replace it with a
  # floating tag, and do not let it go stale.
  #
  # `runner` and `init-dind-externals` carry the SAME image: the init copies
  # /home/runner/externals out of the distribution the runner then executes.
  # `configure-inotify` only runs /bin/sh and keeps upstream's image.
  # tests/runner_image.py holds the pin and the alignment on the rendered
  # PodSpec.

  controllerServiceAccount:
    namespace: arc-systems
    name: arc-systems-gha-rs-controller

  template:
    spec:
      initContainers:
        # inotify instances are shared by all processes with the same real UID
        # on a node (the runners use UID 1001). The kernel's default 128 can
        # reject a watcher while ordinary file descriptors remain available.
        # Run before either runner or dind can accept work, not in a CI job.
        - name: configure-inotify
          image: ghcr.io/actions/actions-runner:2.337.0@sha256:e5496277be5d09bc968b3d64911b74e219ac4a3f2edce956a3ecf9271bea1ef4
          command:
            - /bin/sh
            - -ec
            - |
              minimum=${ARC_INOTIFY_MIN_USER_INSTANCES:-1024}
              case "$minimum" in
                ''|*[!0-9]*) echo "ARC_INOTIFY_MIN_USER_INSTANCES must be a non-negative integer" >&2; exit 1 ;;
              esac
              # Normalize decimal input and reject values outside the kernel's
              # signed-int range before any shell arithmetic or sysctl write.
              while [ "${minimum#0}" != "$minimum" ]; do minimum=${minimum#0}; done
              minimum=${minimum:-0}
              if [ "${#minimum}" -gt 10 ] || [ "$minimum" -gt 2147483647 ]; then
                echo "ARC_INOTIFY_MIN_USER_INSTANCES exceeds the kernel integer range" >&2
                exit 1
              fi
              if [ "$minimum" -eq 0 ]; then
                echo "ARC inotify node tuning disabled explicitly"
                exit 0
              fi
              limit_file=/proc/sys/fs/inotify/max_user_instances
              # cat, not the shell's `read`: a sysctl file answers only a read
              # at offset 0, and dash reads byte by byte — `read` gets the
              # first digit, then EOF, and exits 1 without a word under -e.
              current=$(cat "$limit_file")
              if [ "$current" -lt "$minimum" ]; then
                printf '%s\n' "$minimum" > "$limit_file"
              fi
              actual=$(cat "$limit_file")
              if [ "$actual" -lt "$minimum" ]; then
                echo "ARC inotify ceiling is still below the requested floor" >&2
                exit 1
              fi
              echo "ARC node inotify max_user_instances: $current -> $actual (minimum $minimum)"
          env:
            - name: ARC_INOTIFY_MIN_USER_INSTANCES
              value: "1024"
          securityContext:
            # This is a NODE sysctl, not a pod namespaced sysctl. The existing
            # dind container is privileged too; keep this action explicit.
            privileged: true
            runAsNonRoot: false
            runAsUser: 0
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
        - name: init-dind-externals
          image: ghcr.io/socialgouv/iterion-ci-runner:1.12.1@sha256:4606f71d1ab9002b94622cec3812f2674b853ef4e8581ba8ea7fe64c9e8aa417
          imagePullPolicy: Always
          command:
            [
              "cp",
              "-r",
              "-v",
              "/home/runner/externals/.",
              "/home/runner/tmpDir/",
            ]
          volumeMounts:
            - name: dind-externals
              mountPath: /home/runner/tmpDir
          # A copy of a few files, done before dind and the runner start: it
          # never runs beside them, so it adds nothing to the pod's request.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
        - name: dind
          # Privileged: pinned by version and digest like every privileged
          # container here (tests/privileged_images.py). A floating tag is
          # resolved by each pod at its own start, so a new Docker release
          # would reach the merge queue's required checks unreviewed.
          image: docker:29.8.1-dind@sha256:3f3c01aaaebf7cce837356b688b7c059a4749f10bd7660dec7c58fc454a283f0
          # Native sidecar: kubelet waits for the daemon before starting runner.
          # A socket file alone is not evidence that the Docker API is ready.
          restartPolicy: Always
          startupProbe:
            exec:
              command:
                - docker
                - --host=unix:///run/docker/docker.sock
                - info
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          # The daemon itself idles at ~30Mi; the containers a job starts run
          # in ITS cgroup (a mongod for iterion's mongo-conformance), hence
          # 512Mi. See README "CPU and memory requests".
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
          args:
            - dockerd
            - --host=unix:///run/docker/docker.sock
            - --group=$(DOCKER_GROUP_GID)
            # Docker Hub pulls made by jobs (docker run, services:) leave the
            # cluster anonymously from a shared egress, which Docker Hub
            # rate-limits per IP; kube-image-keeper does not see them. The
            # daemon asks this mirror of Docker Hub first and falls back to
            # Docker Hub on its own.
            - --registry-mirror=https://mirror.gcr.io
          env:
            - name: DOCKER_GROUP_GID
              value: "123"
            - name: DOCKER_IPTABLES_LEGACY
              value: "1"
          securityContext:
            privileged: true
          volumeMounts:
            - name: work
              mountPath: /home/runner/_work
            - name: dind-sock
              mountPath: /run/docker
            - name: dind-externals
              mountPath: /home/runner/externals
      containers:
        - name: runner
          image: ghcr.io/socialgouv/iterion-ci-runner:1.12.1@sha256:4606f71d1ab9002b94622cec3812f2674b853ef4e8581ba8ea7fe64c9e8aa417
          imagePullPolicy: Always
          command: ["/home/runner/run.sh"]
          # Measured on iterion's CI (2026-09-29, 45 min, 39 runner pods): a
          # pod's mean CPU runs from 0.3 core (vendor-check) to 3-4.7 cores
          # (test, golangci), with bursts to 11+; at the busiest sample 11 pods
          # used 21.7 cores together — 2 per pod, where the scheduler counted
          # 1 (500m here + 500m for dind). No limit: a burst uses a node's
          # idle cores. See README "CPU and memory requests".
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
          env:
            - name: DOCKER_HOST
              value: unix:///run/docker/docker.sock
          volumeMounts:
            - name: work
              mountPath: /home/runner/_work
            - name: dind-sock
              mountPath: /run/docker
              readOnly: true

      volumes:
        - name: work
          emptyDir: {}
        - name: dind-sock
          emptyDir: {}
        - name: dind-externals
          emptyDir: {}
