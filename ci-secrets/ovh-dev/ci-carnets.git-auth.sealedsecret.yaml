---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: git-auth
  namespace: ci-carnets
spec:
  encryptedData:
    GIT_AUTH_TOKEN: 
  template:
    metadata:
      annotations:
        socialgouv.github.io/description: Forge token the kontinuous degit checkouts
          authenticate with. GitHub throttles anonymous git access per egress IP,
          which breaks in-cluster checkouts. Copied into every deployed namespace
          by the kontinuous importSecrets pre-deploy plugin.
        socialgouv.github.io/owner: 'SocialGroovyBot personal access token (classic,
          no scope: identity only)'
      creationTimestamp: null
      labels:
        app.kubernetes.io/name: git-auth
        app.kubernetes.io/part-of: kontinuous
      name: git-auth
      namespace: ci-carnets
