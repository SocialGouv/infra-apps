apiVersion: v2
name: iterion
version: 0.0.0
description: Iterion cloud (workflow engine) — server + runner + bundled Mongo/NATS/MinIO
dependencies:
  - name: iterion
    repository: oci://ghcr.io/socialgouv/charts
    # 3.53.0: the graceful-shutdown/probe pass. On SIGTERM the server now
    # answers 503 on /readyz for ITERION_SHUTDOWN_DELAY (5s) while its
    # listener still accepts, so the endpoints controller pulls the pod
    # BEFORE the socket closes — without it every rolling deploy and every
    # HPA scale-down refused connections that were still routed there (a 502
    # in the studio, a dropped forge webhook). Hence also
    # server.terminationGracePeriodSeconds: 60, which must cover
    # delay + ITERION_SHUTDOWN_TEARDOWN (30s); prod ran on the k8s default of
    # 30s, i.e. exactly the teardown budget with zero margin. Plus a
    # startupProbe on both pods (a cloud boot connects NATS + S3 + Mongo and
    # ensures ~28 collections BEFORE binding, which could outlast the
    # liveness budget and CrashLoop a merely-slow pod), and REAL probes on
    # the runner: its tcpSocket on the metrics port proved a socket was
    # listening and nothing about the consume loop, so a runner whose
    # consumer had died stayed Ready forever, consuming nothing.
    # Rides along: the bundled NATS subchart 1.2.11 → 2.14.5 (server
    # 2.10.26 → 2.14.5, config-reloader 0.16.1 → 0.23.0). Taken deliberately
    # on 2026-08-21 in the safest window available — 3 NATS replicas so the
    # rolling upgrade keeps quorum, ITERION_RUNS and KV_iterion-run-locks
    # both empty, zero runs in flight — and 3.53.0 itself makes NATS
    # non-critical for server readiness, so a broker blip no longer takes
    # every replica out of the Service at once.
    # 3.21.0: the chart tracks appVersion now, so 0.50.0 → 3.21.0 is a
    # RENUMBERING and not three majors of drift — only `secret-auth.yaml`
    # differed between the two, additively, for the webpush VAPID keys. What
    # it brings is the runner's lame-duck drain: on SIGTERM the pod stops
    # claiming work and lets its in-flight run FINISH. That matters well
    # beyond deploys — KEDA scales this pool down whenever the queue drains
    # and picks its victim without knowing which pods are busy, which killed
    # a run 21 minutes into a campaign on 2026-08-01. A PodDisruptionBudget
    # does not cover it: a scale-down deletes rather than evicts, so it never
    # consults one.
    # 0.37.4: `config.extraEnv` passthrough (TZ=Europe/Paris) + tzdata embedded
    # in the binary. 0.37.2: opt-in `runner.cache` shared RWX build-cache PVC
    # (GOMODCACHE + GOCACHE) so runner pods don't recompile from cold (ADR-066).
    # 0.35.0: KEDA runner ScaledObject supplies the required JetStream `account`
    # ($G) — without it the scaler was Ready=False and no HPA metric. 0.34.0:
    # Memory-backed emptyDir on /run/iterion for in-pod `as: file` secrets.
    # 0.33.0: ITERION_SANDBOX_OVERRIDE=none. 0.32.0: per-runner image overrides.
    version: 3.53.0
  # Valkey HA (Sentinel) — distributed ephemeral state for the multi-replica
  # server. cloudpirates/valkey (architecture: replication + sentinel), the
  # same chart no-package-malware runs in prod. ovh-prod opts in via
  # `valkeyha.enabled`; ovh-dev (single replica) stays in-memory.
  - alias: valkeyha
    name: valkey
    repository: https://cloudpirates-io.github.io/helm-charts
    version: 0.10.3
    condition: valkeyha.enabled
  # --- ovh-prod community datastores (replace the iterion subchart's deprecated
  # Bitnami mongodb+minio). Their values live at top-level `mongodb:` / `minio:`
  # (distinct from `iterion.mongodb` / `iterion.minio` which gate the bundled
  # Bitnami subcharts — disabled in values.ovh-prod.yaml).
  # ovh-dev keeps the Bitnami subcharts on (conditions below stay false there).
  - name: mongodb
    repository: https://groundhog2k.github.io/helm-charts/
    version: 0.7.8
    condition: mongodb.enabled
  - name: minio
    repository: https://charts.min.io/
    version: 5.4.0
    condition: minio.enabled
