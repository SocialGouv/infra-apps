{{- if and (eq .Values.cluster "ovh-prod") .Values.valkeyfiler.enabled }}
# Password of valkeyfiler (the SeaweedFS filers' metadata store) and of its
# Sentinels, which the chart configures with the same requirepass. Read by the
# valkeyfiler pods (auth.existingSecret) and the SeaweedFS filers
# (WEED_REDIS2_SENTINEL_PASSWORD / _SENTINEL_PASSWORD). Random 48 alphanumeric
# characters — the chart writes it into valkey.conf between double quotes —
# generated and sealed in one pipe. Strict scope, ovh-prod controller cert.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: iterion-valkeyfiler-auth
  namespace: iterion
spec:
  encryptedData:
    password: 
  template:
    metadata:
      creationTimestamp: null
      name: iterion-valkeyfiler-auth
      namespace: iterion
{{- end }}
