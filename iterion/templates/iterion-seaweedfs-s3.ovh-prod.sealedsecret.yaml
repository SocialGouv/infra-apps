{{- if eq .Values.cluster "ovh-prod" }}
{{- /*
The SeaweedFS S3 gateway reads its identities from ONE key,
`seaweedfs_s3_config`, holding the whole identities JSON; the chart mounts it
at /etc/sw/seaweedfs_s3_config and passes it as `-config`
(`seaweedfs.s3.existingConfigSecret` in values.ovh-prod.yaml).

Its single identity carries the key pair of ITERION_S3_ACCESS_KEY_ID /
ITERION_S3_SECRET_ACCESS_KEY in `iterion-storage`: the server, the runners and
the bucket Jobs authenticate with that pair, whichever store the endpoint
names. Shape (single line, no trailing newline):

  {"identities":[{"name":"iterion","credentials":[{"accessKey":"<ITERION_S3_ACCESS_KEY_ID>","secretKey":"<ITERION_S3_SECRET_ACCESS_KEY>"}],"actions":["Admin","Read","List","Tagging","Write"]}]}

`Read,List,Tagging,Write` cover every call pkg/store/blob/s3.go makes; `Admin`
lets the same identity create the bucket (mkbucket Job). Never add an identity
named `anonymous`: it is the one path by which unsigned requests get served.

Sealed straight from the live `iterion-storage`, the clear JSON never written
anywhere (strict scope, ovh-prod controller cert):

  kubectl -n iterion get secret iterion-storage -o json \
    | jq -cj '{identities:[{name:"iterion",credentials:[{accessKey:(.data.ITERION_S3_ACCESS_KEY_ID|@base64d),secretKey:(.data.ITERION_S3_SECRET_ACCESS_KEY|@base64d)}],actions:["Admin","Read","List","Tagging","Write"]}]}' \
    | kubeseal --raw --scope strict --namespace iterion --name iterion-seaweedfs-s3 \
        --cert https://kubeseal.ovh-prod.fabrique.social.gouv.fr/v1/cert.pem --from-file=/dev/stdin

Rotating the pair: re-seal BOTH secrets, then restart the S3 gateways — they
read the file at start.
*/}}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: iterion-seaweedfs-s3
  namespace: iterion
spec:
  encryptedData:
    seaweedfs_s3_config: 
  template:
    metadata:
      creationTimestamp: null
      name: iterion-seaweedfs-s3
      namespace: iterion
{{- end }}
