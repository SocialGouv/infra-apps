{{- if eq .Values.cluster "ovh-prod" }}
{{- /*
TEMPLATE — `encryptedData` below is a placeholder. Replace it with a real seal
before this app is synced with `seaweedfs.enabled: true`; nothing here carries a
value.

The SeaweedFS S3 gateway reads its identities from ONE secret key,
`seaweedfs_s3_config`, holding the whole identities JSON. The chart mounts that
key at /etc/sw/seaweedfs_s3_config and passes it as `-s3.config` (see
`seaweedfs.s3.existingConfigSecret` in values.ovh-prod.yaml).

The accessKey / secretKey inside that JSON MUST equal
ITERION_S3_ACCESS_KEY_ID / ITERION_S3_SECRET_ACCESS_KEY in the `iterion-storage`
SealedSecret — the contract `iterion-minio-creds` had with it. A different pair
means the server's HeadBucket gets a 403 and /readyz never turns green.

Plaintext shape to seal (single line, no trailing newline):

  {"identities":[{"name":"iterion","credentials":[{"accessKey":"<ITERION_S3_ACCESS_KEY_ID>","secretKey":"<ITERION_S3_SECRET_ACCESS_KEY>"}],"actions":["Admin","Read","List","Tagging","Write"]}]}

`Read,List,Tagging,Write` cover every call pkg/store/blob/s3.go makes; `Admin`
additionally lets the identity create the bucket, which the mkbucket Job needs.

Sealed by hand, strict scope like the other secrets in this directory, so the
plaintext never lands in a file:

  printf '%s' "$SEAWEEDFS_S3_CONFIG_JSON" \
    | kubeseal --raw --scope strict \
        --namespace iterion --name iterion-seaweedfs-s3 \
        --controller-name sealed-secrets --controller-namespace sealed-secrets

Paste the output as the value of `seaweedfs_s3_config` below.
*/}}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: iterion-seaweedfs-s3
  namespace: iterion
spec:
  encryptedData:
    seaweedfs_s3_config: REPLACE_WITH_KUBESEAL_RAW_OUTPUT
  template:
    metadata:
      creationTimestamp: null
      name: iterion-seaweedfs-s3
      namespace: iterion
{{- end }}
