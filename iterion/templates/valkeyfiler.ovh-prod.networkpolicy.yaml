{{- if and (eq .Values.cluster "ovh-prod") .Values.valkeyfiler.enabled }}
# valkeyfiler holds the SeaweedFS filers' metadata — every object's key ->
# needle index. Only its own pods (replication, Sentinel) and the SeaweedFS
# filers may reach it; anything else in the cluster is refused. Kubelet probes
# are node traffic, outside NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iterion-valkeyfiler
  namespace: iterion
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: valkeyfiler
      app.kubernetes.io/instance: iterion
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: valkeyfiler
              app.kubernetes.io/instance: iterion
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: seaweedfs
              app.kubernetes.io/instance: iterion
              app.kubernetes.io/component: filer
      ports:
        - protocol: TCP
          port: {{ .Values.valkeyfiler.service.targetPort }}
        - protocol: TCP
          port: {{ .Values.valkeyfiler.sentinel.port }}
{{- end }}
