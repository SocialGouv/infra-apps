{{- if and (eq .Values.cluster "ovh-prod") .Values.seaweedfs.migrate.enabled }}
{{- $m := .Values.seaweedfs.migrate }}
{{- if not (has $m.direction (list "forward" "reverse")) }}
{{- fail (printf "seaweedfs.migrate.direction must be \"forward\" or \"reverse\", got %q" $m.direction) }}
{{- end }}
{{- $ignoreExisting := has "--ignore-existing" $m.extraFlags }}
# MinIO <-> SeaweedFS bucket copy, as a PLAIN resource — never a hook: an Argo
# CD PostSync hook waits for EVERY resource of the app to be Healthy, and one
# unhealthy resource anywhere would leave it, and the sync, hanging.
#
#   forward  MinIO -> SeaweedFS: the copy before the endpoint cutover, and the
#            sweeps after it (with --ignore-existing, see the values).
#   reverse  SeaweedFS -> MinIO: rollback. SeaweedFS is then the source of
#            truth, so its version of a key overwrites MinIO's.
#
# The Job name carries direction and runId: bumping runId runs a new copy (a
# Job spec is immutable). The completed Job stays until migrate.enabled goes
# back to false, which prunes it.
#
# The verify decides, not the copy:
#   - `rclone check --one-way --download` re-reads BOTH sides byte by byte.
#     `--checksum` would not do: rclone cannot hash a multipart object
#     (composite ETag), reports it as a NOTICE and exits 0 — a 300 000-byte
#     object zeroed out, same size, passed that way.
#   - With --ignore-existing a differing object means "newer on the
#     destination", so there only the missing and the errored objects fail.
#   - `rclone size` exits 3 on an absent bucket: neither side can be silently
#     empty. Object count and bytes are printed for both sides.
apiVersion: batch/v1
kind: Job
metadata:
  name: iterion-seaweedfs-migrate-{{ $m.direction }}-{{ $m.runId }}
  namespace: iterion
  annotations:
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        # Admitted by the S3 gateway's NetworkPolicy (seaweedfs.networkPolicy).
        app.kubernetes.io/name: iterion-seaweedfs-job
        app.kubernetes.io/instance: iterion
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: copy
          # rclone, pinned by digest (same image as the mkbucket Job).
          image: rclone/rclone@sha256:d5971950c2b370fb04dd3292541b5bda6d9103143fd7e345aeb435a399388afc
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            # Both stores answer to the same key pair: iterion-storage.
            - name: RCLONE_CONFIG_MINIO_TYPE
              value: s3
            - name: RCLONE_CONFIG_MINIO_PROVIDER
              value: Minio
            - name: RCLONE_CONFIG_MINIO_ENDPOINT
              value: http://iterion-minio:9000
            - name: RCLONE_CONFIG_MINIO_REGION
              value: "{{ .Values.iterion.config.s3.region }}"
            - name: RCLONE_CONFIG_MINIO_FORCE_PATH_STYLE
              value: "true"
            - name: RCLONE_CONFIG_MINIO_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: iterion-storage
                  key: ITERION_S3_ACCESS_KEY_ID
            - name: RCLONE_CONFIG_MINIO_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: iterion-storage
                  key: ITERION_S3_SECRET_ACCESS_KEY
            - name: RCLONE_CONFIG_SWFS_TYPE
              value: s3
            - name: RCLONE_CONFIG_SWFS_PROVIDER
              value: Other
            - name: RCLONE_CONFIG_SWFS_ENDPOINT
              value: http://iterion-seaweedfs-s3:8333
            - name: RCLONE_CONFIG_SWFS_REGION
              value: "{{ .Values.iterion.config.s3.region }}"
            - name: RCLONE_CONFIG_SWFS_FORCE_PATH_STYLE
              value: "true"
            - name: RCLONE_CONFIG_SWFS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: iterion-storage
                  key: ITERION_S3_ACCESS_KEY_ID
            - name: RCLONE_CONFIG_SWFS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: iterion-storage
                  key: ITERION_S3_SECRET_ACCESS_KEY
            - name: DIRECTION
              value: {{ $m.direction | quote }}
            - name: SRC
              value: {{ ternary "swfs" "minio" (eq $m.direction "reverse") | quote }}
            - name: DST
              value: {{ ternary "minio" "swfs" (eq $m.direction "reverse") | quote }}
            - name: BUCKET
              value: "{{ .Values.iterion.config.s3.bucket }}"
            - name: HOME
              value: /tmp
            - name: RCLONE_CONFIG
              value: /tmp/rclone.conf
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          command:
            - /bin/sh
            - -eu
            - -c
            - |
              echo "== ${DIRECTION}: ${SRC}:${BUCKET} -> ${DST}:${BUCKET} =="
              echo "== before: source =="
              rclone size "${SRC}:${BUCKET}"
              echo "== before: destination =="
              rclone size "${DST}:${BUCKET}"

              echo "== copy =="
              rclone copy "${SRC}:${BUCKET}" "${DST}:${BUCKET}" \
                --checksum --transfers={{ $m.transfers }} \
                --checkers={{ $m.checkers }} \
                --stats=30s --stats-one-line --log-level INFO \
                {{ join " " $m.extraFlags }}

              echo "== verify =="
              {{- if $ignoreExisting }}
              set +e
              rclone check "${SRC}:${BUCKET}" "${DST}:${BUCKET}" --one-way --download \
                --missing-on-dst /tmp/missing.txt --differ /tmp/differ.txt --error /tmp/errors.txt
              rc=$?
              set -e
              if [ -s /tmp/errors.txt ]; then
                echo "FAIL: objects that could not be checked:"; cat /tmp/errors.txt; exit 1
              fi
              if [ -s /tmp/missing.txt ]; then
                echo "FAIL: source objects absent from the destination:"; cat /tmp/missing.txt; exit 1
              fi
              if [ -s /tmp/differ.txt ]; then
                echo "newer on the destination (kept, expected with --ignore-existing):"; cat /tmp/differ.txt
              elif [ "$rc" -ne 0 ]; then
                echo "FAIL: rclone check exited $rc with nothing missing, differing or errored"; exit 1
              fi
              echo "no source object is missing from the destination"
              {{- else }}
              rclone check "${SRC}:${BUCKET}" "${DST}:${BUCKET}" --one-way --download
              {{- end }}

              echo "== after: source =="
              rclone size "${SRC}:${BUCKET}"
              echo "== after: destination =="
              rclone size "${DST}:${BUCKET}"
              echo "MIGRATION VERIFIED (${DIRECTION}) for bucket ${BUCKET}"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
