{{- if and (eq .Values.cluster "ovh-prod") .Values.valkeyha.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "valkey.fullname" .Subcharts.valkeyha }}
  namespace: {{ .Release.Namespace }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "valkey.selectorLabels" .Subcharts.valkeyha | nindent 6 }}
{{- end }}
