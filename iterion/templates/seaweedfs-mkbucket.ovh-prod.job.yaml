{{- /*
Creates the iterion bucket on SeaweedFS, as a PLAIN resource.

Nothing in iterion creates its bucket (pkg/store/blob has no CreateBucket),
so it must exist before the first write. The chart's own path,
`s3.createBuckets`, renders a post-install Helm hook, which Argo CD runs as a
PostSync hook — only once EVERY resource of the app is Healthy. With a single
unhealthy resource anywhere in the app it never runs, and the sync operation
stays Running behind it, blocking the next ones. A plain resource runs during
the sync and retries until the gateway answers.

It talks S3 with the very credentials the server uses, so a seal mismatch
between iterion-storage and iterion-seaweedfs-s3 fails HERE, loudly.
`rclone mkdir` on an existing bucket exits 0, so re-runs are free.

The Job name carries a hash of its own spec and there is no Replace/Force:
Argo CD applies an unchanged Job as a no-op, so a sync never re-runs it; a
changed spec gets a new name and the old Job is pruned.
*/}}
{{- if and (eq .Values.cluster "ovh-prod") .Values.seaweedfs.enabled }}
{{- $spec := include "iterion.seaweedfsMkbucketJobSpec" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: iterion-seaweedfs-mkbucket-{{ $spec | sha256sum | trunc 8 }}
  namespace: iterion
spec:
{{ $spec | indent 2 }}
{{- end }}

{{- define "iterion.seaweedfsMkbucketJobSpec" -}}
backoffLimit: 60 # retry while masters elect, volumes register and the gateway comes up
template:
  metadata:
    labels:
      # Admitted by the S3 gateway's NetworkPolicy (seaweedfs.networkPolicy).
      app.kubernetes.io/name: iterion-seaweedfs-job
      app.kubernetes.io/instance: iterion
      app.kubernetes.io/component: mkbucket
  spec:
    restartPolicy: OnFailure
    securityContext:
      fsGroup: 1000
      runAsGroup: 1000
      runAsUser: 1000
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: mkbucket
        # rclone, pinned by digest. Public image, MIT, built by the rclone
        # project's own CI (org.opencontainers.image.source =
        # github.com/rclone/rclone, revision 1a98c36a7358).
        image: rclone/rclone@sha256:d5971950c2b370fb04dd3292541b5bda6d9103143fd7e345aeb435a399388afc
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        env:
          - name: RCLONE_CONFIG_DST_TYPE
            value: s3
          - name: RCLONE_CONFIG_DST_PROVIDER
            value: Other
          - name: RCLONE_CONFIG_DST_ENDPOINT
            value: http://iterion-seaweedfs-s3:8333
          - name: RCLONE_CONFIG_DST_REGION
            value: "{{ .Values.iterion.config.s3.region }}"
          - name: RCLONE_CONFIG_DST_FORCE_PATH_STYLE
            value: "true"
          # The very creds the iterion server authenticates with.
          - name: RCLONE_CONFIG_DST_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: iterion-storage
                key: ITERION_S3_ACCESS_KEY_ID
          - name: RCLONE_CONFIG_DST_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: iterion-storage
                key: ITERION_S3_SECRET_ACCESS_KEY
          - name: BUCKET
            value: "{{ .Values.iterion.config.s3.bucket }}"
          - name: HOME
            value: /tmp
          - name: RCLONE_CONFIG
            value: /tmp/rclone.conf
        volumeMounts:
          - name: tmp
            mountPath: /tmp
        command:
          - /bin/sh
          - -ec
          - |
            # mkdir creates the bucket and is a no-op (exit 0) when it exists.
            rclone mkdir "dst:${BUCKET}"
            # Read it back: `rclone size` exits 3 on a bucket that is not
            # there, so this is a real check and not a hopeful echo.
            rclone size "dst:${BUCKET}"
            echo "bucket ${BUCKET} present on the SeaweedFS gateway"
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 256Mi
    volumes:
      - name: tmp
        emptyDir: {}
{{- end }}
