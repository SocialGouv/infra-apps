{{- if and (eq .Values.cluster "ovh-prod") .Values.seaweedfs.enabled }}
# JWT signing keys of SeaweedFS, read by every component through
# seaweedfs.global.seaweedfs.extraEnvironmentVars (WEED_JWT_*):
#   volume-write / volume-read  jwt.signing.key / jwt.signing.read.key
#   filer-write / filer-read    jwt.filer_signing.key / jwt.filer_signing.read.key
# Random 64-character values, generated and sealed in one pipe, never written
# in clear. Strict scope, ovh-prod controller cert. Rotating one means
# restarting every SeaweedFS pod: the keys are read at start.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: iterion-seaweedfs-jwt
  namespace: iterion
spec:
  encryptedData:
    volume-write: 
    volume-read: 
    filer-write: 
    filer-read: 
  template:
    metadata:
      creationTimestamp: null
      name: iterion-seaweedfs-jwt
      namespace: iterion
{{- end }}
