{{- if eq .Values.cluster "ovh-prod" }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: iterion-llm
  namespace: iterion
spec:
  encryptedData:
    # SENTRY_DSN — error-tracking ingest key for the sentry2.fabrique
    # `iterion` project (ingest-only credential; consumed by pkg/errtrack in
    # both the server and runner via this secret's envFrom). Sealed with
    # `kubeseal --raw --scope strict --namespace iterion --name iterion-llm`.
    SENTRY_DSN: 
    # ANTHROPIC_API_KEY removed 2026-07-19: it was credit-depleted and, while
    # present, the claude_code CLI preferred it over the CLAUDE_CODE_OAUTH_TOKEN
    # forfait. Anthropic now runs on the forfait (iterion-forfait secret).
    OPENAI_API_KEY: 
  template:
    metadata:
      creationTimestamp: null
      name: iterion-llm
      namespace: iterion
{{- end }}
