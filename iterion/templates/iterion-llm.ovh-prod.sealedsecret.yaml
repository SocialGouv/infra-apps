{{- if eq .Values.cluster "ovh-prod" }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: iterion-llm
  namespace: iterion
spec:
  encryptedData:
    # SENTRY_DSN — error-tracking ingest key for the sentry2.fabrique
    # `iterion` project (ingest-only credential; consumed by pkg/errtrack in
    # both the server and runner via this secret's envFrom). Sealed with
    # `kubeseal --raw --scope strict --namespace iterion --name iterion-llm`.
    SENTRY_DSN: 
    # No provider API key here on purpose: Anthropic and OpenAI run on the
    # platform-tier OAuth forfaits (DB-backed, `iterion remote admin llm oauth`).
    # An env key would take precedence over them (OPENAI_API_KEY wins over the
    # ChatGPT forfait) and a dead one poisons every credential auto-detect on the
    # pod (#619).
  template:
    metadata:
      creationTimestamp: null
      name: iterion-llm
      namespace: iterion
{{- end }}
