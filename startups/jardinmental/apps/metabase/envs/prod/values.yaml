metabase:
  host: &metabaseHost metabase-jardinmental.fabrique.social.gouv.fr
  ingress:
    enabled: false
  cnpg-cluster:
    persistence:
      size: 32Gi

oauth2-proxy:
  host: *metabaseHost
  ingress:
    annotations:
      cert-manager.io: cluster-issuer
      cert-manager.io/cluster-issuer: letsencrypt-prod
      kubernetes.io/tls-acme: "true"

final-appset:
  importSecretsFromStartup: false
  importSreSecretsList:
    - matomo-key
  namespace:
    labels:
      sre.socialgouv.github.io/startup: monsuivipsy
