apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: metabase
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`metabase-les1000jours.fabrique.social.gouv.fr`)
      middlewares:
        - name: metabase-body-limit
      priority: 10000
      services:
        - name: oauth2-proxy
          port: 80
          serversTransport: metabase-timeout
  tls:
    # still the cert issued for the now-disabled metabase Ingress: it stays
    # valid and keeps serving while cert-manager issues oauth2-proxy-crt from
    # the proxy Ingress. Switch to oauth2-proxy-crt once that one is Ready.
    secretName: metabase-crt
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: metabase-body-limit
spec:
  buffering:
    maxRequestBodyBytes: 8388608
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: metabase-timeout
spec:
  forwardingTimeouts:
    dialTimeout: 30s
    responseHeaderTimeout: 1800s
