metabase:
  enabled: true
  fullnameOverride: metabase
  cnpg-cluster:
    persistence:
      size: 16Gi
    backup:
      enabled: true
      barmanObjectStore:
        destinationPath: s3://vao-prod-backups/metabase
        endpointURL: https://s3.gra.io.cloud.ovh.net
        s3Credentials:
          accessKeyId:
            name: &s3secretName vao-prod-backups-access-key
          region:
            name: *s3secretName
          secretAccessKey:
            name: *s3secretName

metabase-matomo-sync:
  enabled: true
  fullnameOverride: metabase-matomo-sync
  cnpg-cluster:
    persistence:
      size: 20Gi
    backup:
      enabled: true
      barmanObjectStore:
        destinationPath: s3://vao-prod-backups/metabase-matomo-sync-20241107
        endpointURL: https://s3.gra.io.cloud.ovh.net
        s3Credentials:
          accessKeyId:
            name: &s3secretName vao-prod-backups-access-key
          region:
            name: *s3secretName
          secretAccessKey:
            name: *s3secretName

metabase-matomo-sync-back:
  enabled: true
  fullnameOverride: metabase-matomo-sync-back
  pgdatabase:
    # base commune matomo-sync
    secretName: metabase-matomo-sync-app
  cnpg-cluster:
    enabled: false

oauth2-proxy:
  fullnameOverride: oauth2-proxy
  enabled: true
  upstream: http://metabase
  envFrom:
    - configMapRef:
        name: oauth2-proxy-configmap
    - secretRef:
        name: oauth2-proxy-sealed-secret
  additionalArgs:
    - --skip-auth-route
    # public dashboards, their assets and signed embeds stay reachable without
    # GitHub auth; /api/session/properties is anchored so that login,
    # forgot_password and reset_password stay behind OAuth
    - ^/public/.*,^/app/dist/.*,^/api/public/.*,^/api/session/properties$,^/app/assets/.*,^/embed/.*,^/api/embed/.*
