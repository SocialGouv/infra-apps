metabase:
  enabled: true
  fullnameOverride: metabase
  cnpg-cluster:
    persistence:
      size: 16Gi
    backup:
      enabled: true
      barmanObjectStore:
        destinationPath: s3://cdtn-prod-backups/metabase-ovh
        endpointURL: https://s3.gra.io.cloud.ovh.net
        s3Credentials:
          accessKeyId:
            name: &s3secretName cdtn-prod-backups-access-key
          region:
            name: *s3secretName
          secretAccessKey:
            name: *s3secretName

metabase-matomo-sync:
  enabled: true
  matomoSiteId: 4
  startDate: "2025-04-01"
  forceStartDate: false
  destinationTable: "matomo_partitioned"
  pgdatabase:
    secretName: ovh-database
    secretKey: uri
  fullnameOverride: metabase-matomo-sync
  cnpg-cluster:
    annotations:
      cnpg.io/skipWalArchiving: "enabled"
    persistence:
      size: 60Gi
    clusterExtraSpec:
      postgresql:
        parameters:
          wal_level: minimal
          # archive_mode: "off"
          max_wal_senders: "0"
    # backup:
    #   enabled: true
    #   barmanObjectStore:
    #     destinationPath: s3://cdtn-prod-backups/metabase-matomo-sync-ovh
    #     endpointURL: https://s3.gra.io.cloud.ovh.net
    #     s3Credentials:
    #       accessKeyId:
    #         name: &s3secretName cdtn-prod-backups-access-key
    #       region:
    #         name: *s3secretName
    #       secretAccessKey:
    #         name: *s3secretName

oauth2-proxy:
  fullnameOverride: oauth2-proxy
  enabled: true
  upstream: http://metabase
  envFrom:
    - configMapRef:
        name: oauth2-proxy-configmap
    - secretRef:
        name: oauth2-proxy-sealed-secret
  additionalArgs:
    - --skip-auth-route
    # public dashboards, their assets and signed embeds stay reachable without
    # GitHub auth; /api/session/properties is anchored so that login,
    # forgot_password and reset_password stay behind OAuth
    - ^/public/.*,^/app/dist/.*,^/api/public/.*,^/api/session/properties$,^/app/assets/.*,^/embed/.*,^/api/embed/.*
