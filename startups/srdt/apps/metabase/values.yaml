metabase:
  enabled: true
  fullnameOverride: metabase
  cnpg-cluster:
    backup:
      enabled: true
      barmanObjectStore:
        destinationPath: s3://srdt-dev-backups/metabase-dev
        endpointURL: https://s3.gra.io.cloud.ovh.net
        s3Credentials:
          accessKeyId:
            name: &s3secretName srdt-dev-backups-access-key
          region:
            name: *s3secretName
          secretAccessKey:
            name: *s3secretName

metabase-matomo-sync:
  enabled: true
  matomoSiteId: 134
  startDate: "2025-06-01"
  fullnameOverride: metabase-matomo-sync
  destinationTable: "matomo_partitioned"
  cnpg-cluster:
    persistence:
      size: 30Gi
    backup:
      enabled: true
      barmanObjectStore:
        destinationPath: s3://srdt-prod-backups/metabase-matomo-sync-ovh
        endpointURL: https://s3.gra.io.cloud.ovh.net
        s3Credentials:
          accessKeyId:
            name: &s3secretName srdt-prod-backups-access-key
          region:
            name: *s3secretName
          secretAccessKey:
            name: *s3secretName

oauth2-proxy:
  fullnameOverride: oauth2-proxy
  enabled: true
  upstream: http://metabase
  envFrom:
    - configMapRef:
        name: oauth2-proxy-configmap
    - secretRef:
        name: oauth2-proxy-sealed-secret
  additionalArgs:
    - --skip-auth-route
    # public dashboards, their assets and signed embeds stay reachable without
    # GitHub auth; /api/session/properties is anchored so that login,
    # forgot_password and reset_password stay behind OAuth
    - ^/public/.*,^/app/dist/.*,^/api/public/.*,^/api/session/properties$,^/app/assets/.*,^/embed/.*,^/api/embed/.*
