apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: metabase
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`metabase-1j1s.fabrique.social.gouv.fr`)
      middlewares:
        - name: metabase-body-limit
      priority: 10000
      services:
        - name: oauth2-proxy
          port: 80
          serversTransport: metabase-timeout
  tls:
    # issued by cert-manager through the oauth2-proxy Ingress, which carries the
    # ACME annotations for this host — must stay in sync with it, otherwise
    # Traefik holds two certs for the same SNI and serves them at random
    secretName: oauth2-proxy-crt
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: metabase-body-limit
spec:
  buffering:
    maxRequestBodyBytes: 8388608
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: metabase-timeout
spec:
  forwardingTimeouts:
    dialTimeout: 30s
    responseHeaderTimeout: 1800s
