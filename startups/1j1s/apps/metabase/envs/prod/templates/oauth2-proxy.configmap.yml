kind: ConfigMap
apiVersion: v1
metadata:
  name: oauth2-proxy-configmap
data:
  OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
  # OAUTH2_PROXY_SCOPE is deliberately unset: the github provider's default is
  # "user:email read:org", and read:org is what GITHUB_ORG needs to list the
  # user's orgs. Pinning the scope here silently drops it.
  OAUTH2_PROXY_PROVIDER: github
  OAUTH2_PROXY_GITHUB_ORG: SocialGouv
  OAUTH2_PROXY_BANNER: 1j1s Metabase private access
  OAUTH2_PROXY_FOOTER: SocialGouv auth
  OAUTH2_PROXY_UPSTREAM_TIMEOUT: 20m
  OAUTH2_PROXY_EMAIL_DOMAINS: "*"
  OAUTH2_PROXY_COOKIE_SECURE: "true"
  OAUTH2_PROXY_CUSTOM_SIGN_IN_LOGO: "https://socialgouv.github.io/support/_media/marianne.jpeg"
